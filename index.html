<style>
/* Layout: registro rápido fijo a la izquierda, vistas a la derecha; una columna en celular. */
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --sunk:#E4E9E2; --ink:#15221D; --ink2:#51615A; --line:#D3DBD2;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#D6EAE3; --s1:#0A9477; --s2:#6A4BC4;
  --good:#1B7F53; --warn:#A96B0C; --risk:#C94E14; --crit:#B4232F;
  --good-bg:#DCEFE4; --warn-bg:#F6E8CB; --risk-bg:#F8DFD1; --crit-bg:#F6D9DC;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#161E1B; --sunk:#1E2824; --ink:#E7EEEA; --ink2:#9BABA3; --line:#2B3632;
    --accent:#56C7A8; --accent-ink:#06211B; --accent-soft:#1C3A32; --s1:#35A888; --s2:#9079E0;
    --good:#4CC38A; --warn:#E0A840; --risk:#F0834A; --crit:#F2727C;
    --good-bg:#163326; --warn-bg:#3A2E12; --risk-bg:#3D2416; --crit-bg:#3F1B20;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#161E1B; --sunk:#1E2824; --ink:#E7EEEA; --ink2:#9BABA3; --line:#2B3632;
  --accent:#56C7A8; --accent-ink:#06211B; --accent-soft:#1C3A32; --s1:#35A888; --s2:#9079E0;
  --good:#4CC38A; --warn:#E0A840; --risk:#F0834A; --crit:#F2727C;
  --good-bg:#163326; --warn-bg:#3A2E12; --risk-bg:#3D2416; --crit-bg:#3F1B20;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:24px;font-weight:700}
.brand span{color:var(--ink2);font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.chip input{width:74px;border:0;background:transparent;padding:0;font-weight:600;text-align:right}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.status{font-size:12px;color:var(--ink2)}
.status.bad{color:var(--crit);font-weight:600}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
aside.quick{position:sticky;top:12px}
@media (max-width:860px){aside.quick{position:static}}
.quick .amount{display:flex;gap:8px;align-items:stretch;margin:10px 0}
.quick .amount input{flex:1;min-width:0;font:700 30px/1.1 var(--display);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.lab{font-size:12px;color:var(--ink2);font-weight:600;margin:10px 0 6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px}
.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pick.add{border-style:dashed;color:var(--ink2)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 9px;min-width:0;width:100%}
.field.sm{width:120px}.field.xs{width:76px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:100%;padding:12px;font-size:15px;margin-top:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2);padding:4px 8px;font-size:13px}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[data-armed]{color:var(--crit);border-color:var(--crit)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
nav.tabs a{text-decoration:none;color:var(--ink2);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.eyebrow{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.big{font:700 44px/1 var(--display);margin:6px 0 4px;letter-spacing:-.02em;overflow-wrap:anywhere}
.big.neg{color:var(--crit)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.flow{display:flex;gap:2px;height:14px;margin:14px 0 10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.flow i{display:block;min-width:0}
.f-pay{background:var(--ink)}.f-exp{background:var(--ink2)}.f-pend{background:repeating-linear-gradient(135deg,var(--ink2) 0 3px,transparent 3px 6px)}.f-free{background:var(--good)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px}
.legend div{display:flex;flex-direction:column;font-size:13px}
.legend b{font-size:15px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.care{background:var(--warn-bg);color:var(--warn)}
.pill.risk{background:var(--risk-bg);color:var(--risk)}.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.none{background:var(--sunk);color:var(--ink2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .who{display:flex;flex-direction:column;min-width:0;flex:1 1 160px}
.li .amt{font-weight:600;white-space:nowrap}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border-left:4px solid var(--warn);background:var(--warn-bg);font-size:14px}
.alert.crit{border-color:var(--crit);background:var(--crit-bg)}
.alert.risk{border-color:var(--risk);background:var(--risk-bg)}
.alert.info{border-color:var(--ink2);background:var(--sunk)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font:700 22px/1.15 var(--display);margin-top:3px;overflow-wrap:anywhere}
.debt{display:flex;flex-direction:column;gap:10px}
.debt .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.debt .saldo{font:700 24px/1.1 var(--display)}
.meter{position:relative;height:12px;display:grid;grid-template-columns:30fr 30fr 20fr 20fr;gap:2px;border-radius:5px;overflow:hidden}
.meter span:nth-child(1){background:var(--good-bg)}.meter span:nth-child(2){background:var(--warn-bg)}
.meter span:nth-child(3){background:var(--risk-bg)}.meter span:nth-child(4){background:var(--crit-bg)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.meter i.ok{background:var(--good)}.meter i.care{background:var(--warn)}.meter i.risk{background:var(--risk)}.meter i.crit{background:var(--crit)}
.ticks{display:grid;grid-template-columns:30fr 30fr 20fr 20fr;font-size:11px;color:var(--ink2);margin-top:3px}
.ticks span{text-align:right;padding-right:2px}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.field{max-width:100%}
input[type=date].field,input[type=month].field{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:38px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.f-save{background:var(--s1)}
.prog{position:relative;height:16px;background:var(--sunk);border-radius:6px;margin:14px 0 6px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--s1)}
.prog b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.fx{display:flex;flex-direction:column;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--ink2);text-align:center;font-weight:600;padding-bottom:2px}
.cd{min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 2px;font-size:14px}
.cd.out{visibility:hidden}
.cd.td{border:2px solid var(--ink);font-weight:700}
.cd[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;gap:3px;min-height:7px}
.dots i,.ld{width:7px;height:7px;border-radius:50%;display:inline-block}
.d-in{background:var(--s1)}.d-ok{background:var(--good)}.d-crit{background:var(--crit)}.d-care{background:var(--warn)}.d-next{background:var(--ink2)}
.cd[aria-pressed="true"] .d-next{background:var(--bg)}
a.btn{color:var(--ink);display:inline-flex;align-items:center}
.calday{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.inputs label{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink2);border-top:0}
td.n,th.n{text-align:right}
.monthnav{display:flex;align-items:center;gap:8px}
.range{width:100%;accent-color:var(--accent)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;transform:translate(-50%,-110%);white-space:nowrap;display:none}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px;font-weight:600}
.src{font-size:12px;color:var(--ink2)}
.src a{color:inherit}
@media (prefers-reduced-motion:no-preference){.meter i,.bar .track i,.flow i{transition:width .3s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 id="ttl">Finanzas en familia</h1><span id="sub">Cargando tus datos…</span></div>
    <div class="tools" id="tools"></div>
  </header>
  <div id="gate" class="card" style="max-width:440px;margin:24px auto"><p class="muted">Conectando…</p></div>
  <div class="grid" id="app" hidden>
    <aside class="quick card" id="quick" aria-label="Registro rápido"></aside>
    <main>
      <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
      <div id="view" class="stack"><div class="card muted">Cargando…</div></div>
    </main>
  </div>
  <footer class="small muted" style="text-align:center;padding:24px 0 8px">Finanzas en familia · Versión 1.2 · 14 nov 2026</footer>
</div>

<script>
/*LOGIC-START*/
const L=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
  const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
  const clampDate=(y,m,day)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))};
  function payDates(y,m,days){return days.map(d=>clampDate(y,m,d)).sort((a,b)=>a-b)}
  function period(today,days){
    const t=parse(iso(today));let all=[];
    for(let k=-1;k<=1;k++){const d=new Date(t.getFullYear(),t.getMonth()+k,1);all=all.concat(payDates(d.getFullYear(),d.getMonth(),days))}
    all.sort((a,b)=>a-b);
    let start=all[0],next=all[all.length-1];
    for(const d of all){if(d<=t)start=d}
    for(const d of all){if(d>t){next=d;break}}
    return{start,end:addDays(next,-1),next};
  }
  function dueIn(day,start,end){
    day=day||30;
    for(let k=0;k<=2;k++){const d=clampDate(start.getFullYear(),start.getMonth()+k,day);const dd=clampDate(d.getFullYear(),d.getMonth(),day);if(dd>=start&&dd<=end)return dd;if(dd>end)break}
    return null;
  }
  const toCop=(amt,cur,trm)=>cur==='USD'?amt*trm:amt;
  const debtCop=(d,trm)=>(d.cop||0)+(d.usd||0)*trm;
  const zone=u=>u==null?'none':u<=.30?'ok':u<=.60?'care':u<=.80?'risk':'crit';
  const SMMLV=1750905;
  function ssAporte(incomeCop){const ibc=Math.max(.4*incomeCop,SMMLV);return ibc*(.125+.16+.00522)}
  function commitments(S,movs,per,today){
    const out=[];const t=parse(iso(today));const since=S.since?parse(S.since):null;
    for(const d of S.debts){
      if(d.cuota){
        if(d.cuotasLeft===0||debtCop(d,S.trm)<=0)continue;
        const due=dueIn(d.dia,per.start,per.end);if(!due||(since&&due<since))continue;
        const key=iso(due).slice(0,7);
        const paid=movs.some(m=>m.debtId===d.id&&m.dueKey===key);
        out.push({kind:'cuota',id:d.id,name:d.name,amt:d.cuota,date:due,key,paid,cash:true,nodate:!d.dia,overdue:!paid&&due<t});
      }else if(d.next&&d.next.amt>0){
        const due=d.next.date?parse(d.next.date):null;
        if(!due||due<=per.end)out.push({kind:'debt',id:d.id,name:d.name,amt:d.next.amt,date:due,paid:false,cash:true,nodate:!due,overdue:!!due&&due<t});
      }
    }
    for(const f of S.fixed){
      const due=dueIn(f.day,per.start,per.end);if(!due||(since&&due<since))continue;
      const key=iso(due).slice(0,7);
      const paid=movs.some(m=>m.fixedId===f.id&&m.dueKey===key)||!!(S.prepaid&&S.prepaid[f.id+'|'+key]);
      out.push({kind:'fixed',id:f.id,name:f.name,amt:toCop(f.amt,f.cur,S.trm),date:due,key,paid,cash:f.method==='cuenta',nodate:!f.day,overdue:!paid&&due<t});
    }
    out.sort((a,b)=>(a.date||per.end)-(b.date||per.end));
    return out;
  }
  function netOf(movs,a,b){
    let n=0;for(const m of movs){
      if(m.type==='ingreso'){if(m.sueldo?m.payKey===a:(m.date>=a&&m.date<=b))n+=m.cop}
      else if(m.date>=a&&m.date<=b){if(m.type==='pago'||m.type==='ahorro'||(m.type==='gasto'&&m.method==='cuenta'))n-=m.cop;else if(m.type==='retiro')n+=m.cop}}
    return n;
  }
  /* sobrante acumulado de las quincenas anteriores; nunca arrastra un faltante */
  function carryInto(S,movs,start){
    let first=S.since?parse(S.since):null;
    if(!first){const ds=movs.map(m=>m.date).sort();if(!ds.length)return 0;first=parse(ds[0])}
    let per=period(first,S.income.days),carry=0,guard=0;
    while(per.start<start&&guard++<400){carry=Math.max(0,carry+netOf(movs,iso(per.start),iso(per.end)));per=period(per.next,S.income.days)}
    return carry;
  }
  function periodSummary(S,movs,today){
    const per=period(today,S.income.days);const a=iso(per.start),b=iso(per.end);
    const inP=movs.filter(m=>m.date>=a&&m.date<=b);
    const sum=f=>inP.filter(f).reduce((s,m)=>s+m.cop,0);
    const payMovs=movs.filter(m=>m.type==='ingreso'&&m.sueldo&&m.payKey===a);
    const pay=payMovs.reduce((s,m)=>s+m.cop,0);const received=payMovs.length>0;
    const extra=sum(m=>m.type==='ingreso'&&!m.sueldo);
    const pagos=sum(m=>m.type==='pago');
    const gastosCash=sum(m=>m.type==='gasto'&&m.method==='cuenta');
    const gastosCard=sum(m=>m.type==='gasto'&&m.method!=='cuenta');
    const com=commitments(S,movs,per,today);
    const pend=com.filter(c=>!c.paid&&c.cash).reduce((s,c)=>s+c.amt,0);
    const income=pay+extra;
    const carry=carryInto(S,movs,per.start);
    const ahorro=sum(m=>m.type==='ahorro')-sum(m=>m.type==='retiro');
    const libre=carry+income-pagos-gastosCash-ahorro-pend;
    const daysLeft=Math.round((per.end-parse(iso(today)))/864e5)+1;
    return{per,income,carry,ahorro,pay,received,extra,pagos,gastosCash,gastosCard,pend,libre,daysLeft,com};
  }
  function monthSummary(S,movs,ym){
    const[y,m]=ym.split('-').map(Number);
    const inM=movs.filter(x=>x.date.slice(0,7)===ym);
    const sum=f=>inM.filter(f).reduce((s,x)=>s+x.cop,0);
    const income=sum(x=>x.type==='ingreso');
    const gastosCash=sum(x=>x.type==='gasto'&&x.method==='cuenta');
    const gastosCard=sum(x=>x.type==='gasto'&&x.method!=='cuenta');
    const pagos=sum(x=>x.type==='pago');
    const byCat={};
    inM.filter(x=>x.type==='gasto').forEach(x=>{byCat[x.cat||'otros']=(byCat[x.cat||'otros']||0)+x.cop});
    return{income,gastosCash,gastosCard,pagos,ahorro:sum(x=>x.type==='ahorro')-sum(x=>x.type==='retiro'),balance:income-gastosCash-pagos,deudaDelta:gastosCard-pagos,byCat,items:inM};
  }
  function project(p){
    const bals=p.debts.map(d=>({bal:d.bal,mr:Math.pow(1+(d.rate||0)/100,1/12)-1}));
    const rows=[];let saved=p.saved0||0,debtFree=null,fundAt=null;const max=p.max||96;
    for(let i=0;i<=max;i++){
      const total=bals.reduce((s,b)=>s+b.bal,0);
      rows.push({i,debt:total,saved});
      if(total<=.5&&debtFree===null)debtFree=i;
      if(p.fund>0&&saved>=p.fund&&fundAt===null)fundAt=i;
      if(debtFree!==null&&(fundAt!==null||!(p.fund>0)))break;
      const c=Math.max(0,p.cap-(i>=p.ssAt?p.ssAmt:0));
      bals.forEach(b=>{b.bal*=1+b.mr});
      let toDebt=total>.5?c*p.share:0;let toSave=c-toDebt;
      bals.sort((x,y)=>y.mr-x.mr||x.bal-y.bal);
      for(const b of bals){if(toDebt<=0)break;const pay=Math.min(b.bal,toDebt);b.bal-=pay;toDebt-=pay}
      saved+=toSave+toDebt;
    }
    return{rows,debtFree,fundAt};
  }
  function parseMoney(str,cur){
    let s=String(str||'').trim().toLowerCase().replace(/[$\s]/g,'');if(!s)return NaN;
    let mult=1;if(s.endsWith('k')){mult=1e3;s=s.slice(0,-1)}else if(s.endsWith('m')){mult=1e6;s=s.slice(0,-1)}
    if(cur==='USD')s=s.replace(/,/g,'.');
    else if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(',','.');
    const n=parseFloat(s);return isFinite(n)?n*mult:NaN;
  }
  return{iso,parse,addDays,period,dueIn,toCop,debtCop,zone,ssAporte,commitments,periodSummary,monthSummary,project,parseMoney,SMMLV};
})();
/*LOGIC-END*/
</script>

<script>
(()=>{

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmt=(cop,opt={})=>{

/* ---------- guardar ---------- */
function setStatus(){

let saveT=null,pubT=null,lastPub='';
function saveState(){

  dirty=true;setStatus();clearTimeout(saveT);
  saveT=setTimeout(()=>{dirty=false;FB.setDoc(stateRef,clone(S)).catch(()=>{mode='mem';setStatus()});setStatus();schedulePublish()},300);
}
/* lo único que sale hacia la familia: tres totales por mes */
function schedulePublish(){
  if(!U)return;clearTimeout(pubT);
  pubT=setTimeout(()=>{
    const months={},n=new Date();
    for(let k=0;k<6;k++){const ym=L.iso(new Date(n.getFullYear(),n.getMonth()-k,1)).slice(0,7),ms=L.monthSummary(S,M,ym);
      months[ym]={in:Math.round(ms.income),out:Math.round(ms.gastosCash+ms.gastosCard),bal:Math.round(ms.balance)}}
    const body={name:S.name||U.email,email:U.email,months},sig=JSON.stringify(body);
    if(sig===lastPub)return;lastPub=sig;body.updated=Date.now();
    FB.setDoc('family/'+U.uid,body).catch(()=>{});
  },2500);
}
async function addMov(m){
  m.id=m.id||uid();m.ts=Date.now();M.push(m);
  if(U)FB.setDoc('users/'+U.uid+'/movs/'+m.id,clone(m)).catch(()=>{mode='mem';setStatus()});

}
async function delMov(id){
  const m=M.find(x=>x.id===id);if(!m)return;
  applyMov(m,-1);M=M.filter(x=>x.id!==id);saveState();render();
  if(U)FB.deleteDoc('users/'+U.uid+'/movs/'+id).catch(()=>{});
}
/* efecto de un movimiento sobre los saldos */
function applyMov(m,sign){
  const amt=m.amt*sign;
  if(m.type==='gasto'&&m.method!=='cuenta'){const d=S.debts.find(d=>d.id===m.method);if(d){if(m.cur==='USD')d.usd=Math.max(0,(d.usd||0)+amt);else d.cop=Math.max(0,(d.cop||0)+amt)}}
  if(m.type==='pago'){const d=S.debts.find(d=>d.id===m.debtId);if(d){
    if(m.cur==='USD')d.usd=Math.max(0,(d.usd||0)-amt);else d.cop=Math.max(0,(d.cop||0)-amt);
    if(sign>0&&d.next){if(d.next.date)d.payDay=+d.next.date.slice(8,10);if(m.cop>=d.next.amt-1)d.next=null;else d.next.amt-=m.cop}
    if(m.dueKey&&d.cuotasLeft!=null)d.cuotasLeft=Math.max(0,d.cuotasLeft-sign);
  }}
}

const TABS=[['resumen','Hoy'],['deudas','Deudas'],['mes','Mes'],['fijos','Gastos fijos'],['calendario','Calendario'],['meta','Mi meta'],['familia','Familia'],['ajustes','Ajustes']];
const curTab=()=>{const h=location.hash.slice(1);return TABS.some(t=>t[0]===h)?h:'resumen'};
function renderTabs(){const c=curTab();$('#tabs').innerHTML=TABS.map(t=>`<a href="#${t[0]}" ${t[0]===c?'aria-current="page"':''}>${t[1]}</a>`).join('')}

/* ---------- registro rápido ---------- */

  if(!Q.cat||!S.cats.some(c=>c.id===Q.cat))Q.cat=S.cats[0]?S.cats[0].id:null;

      ${Q.newCat?`<input class="field sm" id="q-newcat" placeholder="Nueva categoría" aria-label="Nombre de la nueva categoría"><button class="btn sm" data-act="q-addcat">Crear</button>`:`<button class="pick add" data-act="q-newcat">+ Nueva</button>`}</div>
      <span class="lab">¿Con qué pagaste?</span><div class="chips"><button class="pick" data-act="q-method" data-v="cuenta" aria-pressed="${Q.method==='cuenta'}">Cuenta / efectivo</button>
      ${chargeable().map(d=>`<button class="pick" data-act="q-method" data-v="${d.id}" aria-pressed="${Q.method===d.id}">${esc(d.name)}</button>`).join('')}</div>`;

}
function quickSave(){
  const amt=L.parseMoney($('#q-amt').value,Q.cur),msg=$('#q-msg');
  if(!(amt>0)){msg.textContent='Escribe un valor mayor que cero.';$('#q-amt').focus();return}

/* ---------- vistas ---------- */
function meter(d){
  const u=util(d);if(u==null)return'';const z=L.zone(u);
  return`<div><div class="meter" role="img" aria-label="Uso del cupo ${pct(u)}: ${ZN[z]}"><span></span><span></span><span></span><span></span><i class="${z}" style="width:${Math.min(100,u*100)}%"></i></div>
  <div class="ticks"><span>30%</span><span>60%</span><span>80%</span><span>100%</span></div></div>`;
}
function alerts(ps){
  const a=[];
  ps.com.filter(c=>c.overdue).forEach(c=>a.push(['crit',`<b>${esc(c.name)}</b> venció el ${dshort(c.date)} y sigue sin pagar (${fmt(c.amt)}).`]));
  if(ps.received&&ps.libre<0)a.push(['crit',`Esta quincena ya vas ${fmt(-ps.libre)} por encima de lo que entra, contando los pagos pendientes.`]);
  S.debts.forEach(d=>{const u=util(d);const z=L.zone(u);
    if(z==='crit')a.push(['crit',`<b>${esc(d.name)}</b> está al ${pct(u)} del cupo. No la uses hasta bajarla.`]);
    else if(z==='risk')a.push(['risk',`<b>${esc(d.name)}</b> está al ${pct(u)} del cupo, en zona de riesgo.`])});
  if(ps.gastosCard>0)a.push(['warn',`Esta quincena pusiste ${fmt(ps.gastosCard)} nuevos en tarjetas. Eso no sale de tu cuenta hoy, pero es deuda.`]);
  const sinCupo=S.debts.filter(d=>d.kind==='tarjeta'&&!d.cupo);
  if(sinCupo.length)a.push(['info',`Falta el cupo de ${sinCupo.map(d=>esc(d.name)).join(', ')}. Agrégalo en <a href="#deudas">Deudas</a> para ver tus rangos.`]);
  const sinPago=S.debts.filter(d=>!d.cuota&&d.kind!=='familia'&&!d.next&&L.debtCop(d,S.trm)>0);
  if(sinPago.length)a.push(['info',`Sin próximo pago registrado: ${sinPago.map(d=>esc(d.name)).join(', ')}. Cuando te llegue el extracto, anota el pago mínimo y la fecha.`]);

  if(nodate.length)a.push(['info',`${nodate.length} pagos fijos no tienen día definido; por ahora los cuento a fin de mes. Ponles día en Deudas o en Gastos fijos.`]);

function curPS(){

  const ref=M.some(m=>m.sueldo&&m.payKey===nk)?p0.next:today;

}
/* cuál quincena falta confirmar: la actual, o la siguiente si ya está a 3 días o menos */
function payTarget(ps){
  const since=S.since?L.parse(S.since):null,has=d=>M.some(m=>m.sueldo&&m.payKey===L.iso(d));
  if(!has(ps.per.start)&&!(since&&ps.per.start<since))return ps.per.start;
  if(!has(ps.per.next)&&ps.daysLeft<=3)return ps.per.next;
  return null;
}
function payBox(tg){

    <div class="muted">Aún no confirmas que entró tu quincena, así que no cuento esa plata.${ps.carry>0?` Lo que ves es el sobrante de la quincena anterior.`:''}${ps.pend>0?` Tienes <b>${fmt(ps.pend)}</b> en pagos pendientes de este periodo.`:''}</div>`:`
    <div class="big ${ps.libre<0?'neg':''}">${ps.libre<0?'− ':''}${fmt(Math.abs(ps.libre))}</div>
    <div class="muted">${ps.libre>=0?`Libres después de pagos y gastos. Son unos <b>${fmt(ps.libre/Math.max(1,ps.daysLeft))}</b> por día hasta el ${dshort(ps.per.next)}.`:'Te faltan para cubrir esta quincena. Revisa qué pago puedes mover o qué gasto frenar.'}</div>`}
    ${payBox(tg)}
    <div class="flow" role="img" aria-label="Reparto del ingreso de la quincena"><i class="f-pay" style="width:${w(ps.pagos)}"></i><i class="f-exp" style="width:${w(ps.gastosCash)}"></i><i class="f-save" style="width:${w(ps.ahorro)}"></i><i class="f-pend" style="width:${w(ps.pend)}"></i><i class="f-free" style="width:${w(ps.libre)}"></i></div>

      ${ps.carry>0?`<div><span>Sobrante anterior</span><b>${fmt(ps.carry)}</b></div>`:''}
      <div><span><i class="sw f-pay"></i>Pagado a deudas</span><b>${fmt(ps.pagos)}</b></div>
      <div><span><i class="sw f-exp"></i>Gastado de tu cuenta</span><b>${fmt(ps.gastosCash)}</b></div>
      ${ps.ahorro?`<div><span><i class="sw f-save"></i>Guardado en tu bolsillo</span><b>${fmt(ps.ahorro)}</b></div>`:''}
      <div><span><i class="sw f-pend"></i>Pagos pendientes</span><b>${fmt(ps.pend)}</b></div>

function calItems(y,m){

/* ---------- acciones ---------- */
function setPath(path,raw,kind){
  let v=raw;
  if(kind==='bool')v=!!raw;
  if(kind==='num'){v=raw===''?null:parseFloat(String(raw).replace(',','.'));if(v!=null&&!isFinite(v))return}
  if(kind==='money'){v=raw===''?null:L.parseMoney(raw,'COP');if(v!=null&&!isFinite(v))return}
  if(kind==='usd'){v=raw===''?0:L.parseMoney(raw,'USD');if(!isFinite(v))return}
  if(kind==='days'){v=String(raw).split(/[^\d]+/).map(Number).filter(n=>n>=1&&n<=31);if(!v.length)return}
  const p=path.split(':');
  if(p[0]==='trm'){if(v>0)S.trm=v;return}
  if(p[0]==='since'){S.since=v||null;return}
  if(p[0]==='name'){S.name=String(v||'').trim();return}
  if(p[0]==='income'){S.income[p[1]]=v;return}
  if(p[0]==='goal'){
    if(p[1]==='sharePct'){S.goal.share=v/100;return}
    if(p[1]==='living'||p[1]==='setup'){S.goal[p[1]][+p[2]][p[3]]=p[3]==='amt'?(v||0):v;return}
    if((p[1]==='date'||p[1]==='kind')&&!v)return;
    S.goal[p[1]]=v;return}
  const arr=S[p[0]],o=arr&&arr.find(x=>x.id===p[1]);if(!o)return;
  if(p[2]==='next.amt'){if(v>0){o.next=o.next||{};o.next.amt=v}else o.next=null;return}
  if(p[2]==='next.date'){if(v||o.next){o.next=o.next||{amt:0};o.next.date=v||null}if(v)o.payDay=+v.slice(8,10);return}
  if(['cop','usd'].includes(p[2]))v=v||0;
  o[p[2]]=v;
}

function normalize(s){const o=Object.assign(clone(EMPTY),s||{});o.goal=Object.assign(clone(EMPTY.goal),s&&s.goal||{});o.income=Object.assign(clone(EMPTY.income),s&&s.income||{});

function stop(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];clearTimeout(saveT);clearTimeout(pubT);U=null;ADMIN=false;FAM=[];INV=[];S=clone(EMPTY);M=[];loaded=false;dirty=false;stateRef=null;lastPub='';$('#view').innerHTML='';$('#quick').innerHTML=''}

async function start(u){
  U=u;gate('<p class="muted">Cargando tus datos…</p>');

    if(!a.exists){try{await FB.setDoc('config/admin',{uid:u.uid});ADMIN=true}catch(e){ADMIN=false}}

    try{localStorage.setItem('fin.admin.'+u.uid,ADMIN?'1':'')}catch(e){}
  }catch(e){try{ADMIN=localStorage.getItem('fin.admin.'+u.uid)==='1'}catch(x){}}

  mode='db';stateRef='users/'+u.uid+'/data/state';

      if(loaded)return;
      S=normalize(clone(SEED));S.since=L.iso(new Date());
      try{S.name=localStorage.getItem('fin.newname')||'';localStorage.removeItem('fin.newname')}catch(e){}
      loaded=true;saveState();
    }else{
      const remote=normalize(clone(snap.data));
      if(loaded&&JSON.stringify(remote)===JSON.stringify(S))return;
      S=remote;loaded=true;
    }

    if(!editing())render();schedulePublish();

  }

  try{fetch('https://www.datos.gov.co/resource/32sa-8pi3.json?$limit=1&$order=vigenciadesde%20DESC').then(r=>r.json()).then(d=>{const v=d&&d[0]&&parseFloat(d[0].valor);if(loaded&&U===u&&v>1000&&v<10000&&Math.abs(v-S.trm)>.5){S.trm=Math.round(v*100)/100;saveState();if(!editing())render()}}).catch(()=>{})}catch(e){}
}
